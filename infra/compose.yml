# Local demo reference only. Do not expose this identity mode to the public Internet.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: goog_ad
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - data:/var/lib/postgresql/data
      - ./init-local.sql:/docker-entrypoint-initdb.d/001-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goog_ad"]
      interval: 3s
      timeout: 3s
      retries: 20
  prepare:
    build: ..
    environment: &env
      APP_MODE: demo
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://ads_app:local-development-only@postgres:5432/goog_ad
      ADMIN_DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/goog_ad
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: ..
    command: ["node", "--use-env-proxy", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0"]
    environment:
      APP_MODE: demo
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://ads_app:local-development-only@postgres:5432/goog_ad
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prepare: {condition: service_completed_successfully}
  worker:
    build: ..
    environment:
      APP_MODE: demo
      DATABASE_URL: postgresql://ads_app:local-development-only@postgres:5432/goog_ad
    command: ["npm", "run", "worker"]
    depends_on:
      prepare: {condition: service_completed_successfully}
volumes:
  data:
